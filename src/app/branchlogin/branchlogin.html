<div class="login-container">
  <div class="container-fluid">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg">
          <div class="card-header bg-primary text-white text-center py-4">
            <h2 class="mb-0">Branch Login</h2>
            <p class="mb-0">Access your branch dashboard</p>
          </div>
          <div class="card-body p-5">
            <form (ngSubmit)="onSubmit()">
              <div class="form-group mb-4">
                <label for="branchId" class="form-label fw-bold">Branch ID</label>
                <input type="text" id="branchId" name="branch" [(ngModel)]="branch" class="form-control form-control-lg" placeholder="Enter your Branch ID" required>
              </div>
              <div class="form-group mb-4">
                <label for="password" class="form-label fw-bold">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" class="form-control form-control-lg" placeholder="Enter your Password" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Login</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
