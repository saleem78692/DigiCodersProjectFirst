<div class="container">
  <div class="header">
    <h1>Branch: {{ branch }}</h1>
    <p>Total Records: {{ branchData.length }}</p>
  </div>

  <!-- <div *ngIf="loading" class="loading">
    <p>Loading branch data...</p>
  </div> -->

  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>

  <div *ngIf="!loading && branchData.length > 0" class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Branch</th>
          <th>Govt District</th>
          <th>Circle AM</th>
          <th>Section AE</th>
          <th>City</th>
          <th>WD Code</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of branchData">
          <td>{{ item.branch }}</td>
          <td>{{ item.govt_District }}</td>
          <td>{{ item.circle_AM }}</td>
          <td>{{ item.section_AE }}</td>
          <td>{{ item.city }}</td>
          <td>{{ item.wD_Code }}</td>
        </tr>

      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && branchData.length === 0" class="no-data">
    <p>No data found for this branch</p>
  </div>
</div>
