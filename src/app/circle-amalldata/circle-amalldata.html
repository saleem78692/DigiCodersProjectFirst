<div class="ca-container">
  <header class="ca-header">
    <div class="title-group">
      <h1 class="title">Circle AM Records</h1>
      <div class="count-badge">{{ filteredCount }} records</div>
    </div>

    
  </header>

  <section class="table-card">
    <table class="data-table" role="table">
      <thead>
        <tr>
          <th>Branch</th>
          <th>Govt District</th>
          <th>Circle AM</th>
          <th>Section AE</th>
          <th>City</th>
          <th>WD Code</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of filteredData; let i = index">
          <td>{{ item.branch }}</td>
          <td>{{ item.govt_District }}</td>
          <td>{{ item.circle_AM }}</td>
          <td>{{ item.section_AE }}</td>
          <td>{{ item.city }}</td>
          <td>{{ item.wD_Code }}</td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="filteredCount === 0" class="empty-state">
      <div class="empty-illustration">📭</div>
      <p>No records match your search.</p>
    </div>
  </section>
</div>
